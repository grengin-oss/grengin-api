[package]
name = "connector-server-plugin"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/grengin-oss/grengin-api"

[dependencies]
base64 = "0.22.1"
llm-plugin = { path = "../llm-plugin" }
percent-encoding = "2.3.2"
jsonschema = { version = "0.49.9", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
axum = "0.8.7"
chrono = { version = "0.4.42", features = ["serde"] }
oauth2 = { version = "5.0.0", features = ["reqwest"] }
openidconnect = "4.0.1"
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
rmcp = { version = "3.8.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
sha2 = "0.10.9"
tokio = { version = "1.48", features = ["full"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
