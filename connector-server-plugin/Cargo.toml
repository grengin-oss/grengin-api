[package]
name = "connector-server-plugin"
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/grengin-oss/grengin-api"

[dependencies]
llm-plugin = { path = "../llm-plugin" }
jsonschema = { version = "0.49.9", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1.0"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["net", "sync", "time", "macros", "rt-multi-thread"] }
url = "2.5"

[dev-dependencies]
axum = "0.8.7"
