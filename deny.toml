# cargo-deny configuration for grengin-api. Also copy this file next to the
# installer crate's Cargo.toml in the root repository.
#
# Run locally with:  cargo deny check licenses
# Docs: https://embarkstudios.github.io/cargo-deny/

[licenses]
# Licenses acceptable inside an Apache-2.0-licensed distribution.
# Extend this list deliberately: one addition per line, with a comment
# naming the crate that needs it. GPL-2.0, GPL-3.0, AGPL-3.0, LGPL, SSPL,
# and BUSL findings are blockers: replace the dependency instead of
# allowing the license.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",     # borrow-or-share, via the JSON Schema validator.
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0", # webpki-roots certificate data.
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "BSL-1.0",   # Boost Software License (permissive). Not Business Source License.
  "MPL-2.0",   # File-level copyleft; fine to ship unmodified in a permissive project.
  "OpenSSL",   # Pulled in via ring on some versions.
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# ring ships a combined license file that cargo-deny cannot always classify.
# If cargo-deny reports a different file hash for the ring version in the
# lockfile, read the file, then update the hash to the one printed in the
# error message.
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]
