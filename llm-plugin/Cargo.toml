[package]
name = "llm-plugin"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1.89"
base64 = "0.22"
futures-core = "0.3.31"
futures-util = "0.3.31"
jsonschema = { version = "0.49.9", default-features = false }
percent-encoding = "2.3.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["net", "sync", "time"] }
url = "2.5.7"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
